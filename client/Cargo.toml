[package]
name = "srw-client"
version.workspace = true
edition.workspace = true
# Two binaries live here (srw-client + srw-mirror-helper); `cargo run`
# means the coordinator.
default-run = "srw-client"

[dependencies]
srw-core = { path = "../core" }
srw-transport = { path = "../transport" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
webrtc = "0.11"
winit = "0.30"
softbuffer = "0.4"
libc = "0.2"
base64 = "0.22"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSThread", "NSDictionary", "NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder", "NSImageRep", "NSBitmapImageRep", "NSGraphics", "NSGraphicsContext"] }
objc2-core-graphics = "0.3"

[dev-dependencies]
tempfile = "3"
